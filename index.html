<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VIIH-STORE - Moda Feminina</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="painel">

        <section class="login-container">

    <div class="login-card">

        <div class="login-logo">♡</div>

        <h1>VIIH-STORE</h1>

        <p class="subtitulo">Moda Feminina</p>

        <h2>Bem-vinda de volta!</h2>

        <p class="descricao">
            Entre para acessar o sistema da loja.
        </p>

        <form id="formLogin">

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

           <label for="senha">Senha</label>

<div class="campo-senha">
    <input
        type="password"
        id="senha"
        placeholder="Digite sua senha"
        required
    >

    <button
        type="button"
        id="mostrarSenha"
        aria-label="Mostrar senha"
        title="Mostrar senha"
    >
        <svg id="iconeSenha" xmlns="http://www.w3.org/2000/svg"
             width="21" height="21" viewBox="0 0 24 24"
             fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
    </button>
</div>

            <div class="esqueci-senha">
                <a href="#" id="esqueciSenha">
                    Esqueci minha senha
                </a>
            </div>

            <button type="submit" id="btnEntrar">
                ENTRAR
            </button>

        </form>

        <p class="rodape-login">
            VIIH STORE — Moda Feminina
        </p>

    </div>

</section>                                                                                      

    </main>
    <script>
const campoSenha = document.getElementById("senha");
const botaoSenha = document.getElementById("mostrarSenha");
const iconeSenha = document.getElementById("iconeSenha");

botaoSenha.addEventListener("click", () => {
    const mostrar = campoSenha.type === "password";

    campoSenha.type = mostrar ? "text" : "password";

    botaoSenha.setAttribute(
        "aria-label",
        mostrar ? "Ocultar senha" : "Mostrar senha"
    );

    botaoSenha.title = mostrar ? "Ocultar senha" : "Mostrar senha";

    iconeSenha.innerHTML = mostrar
        ? '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a13 13 0 0 1-3 3.8"/><path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 3-.5"/>'
        : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
});
</script>
    <script type="module" src="script.js"></script>
</body>
</html>
